<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Annuity Advisor Intelligence - SEC VIP Data Platform</title>
    <meta name="description" content="AI-powered platform for financial advisors to analyze variable annuities and RILAs using SEC data">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Annuity Advisor Intelligence</h1>
            <p class="subtitle">SEC Variable Insurance Products Data Platform</p>
        </header>
        
        <main>
            <div id="chat-container">
                <div id="messages"></div>
                <div class="input-container">
                    <input type="text" id="user-input" placeholder="Ask about variable annuities, fees, riders, or product comparisons...">
                    <button id="send-btn">Send</button>
                </div>
            </div>
        </main>
        
        <footer>
            <p>Data source: SEC Variable Insurance Product Data Sets | For financial advisors only</p>
        </footer>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
